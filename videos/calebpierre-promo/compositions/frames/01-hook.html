<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["01-hook"] = tl;

  const root = document.querySelector('[data-composition-id="01-hook"]');

  /* ---------------------------------------------------------------
     Scene 1 (0.0–2.4s): per-word staggered reveal, adapted from the
     dynamic-content-sequencing recipe — start times are computed once
     from each word's content length (no hardcoded per-item offsets),
     then each word settles on its own fromTo (power3, long-tail).
  --------------------------------------------------------------- */
  const BASE_DURATION = 0.05; // s — floor slot even for short words
  const SEC_PER_CHAR = 0.018; // s/char — content-aware pacing

  const words = Array.from(root.querySelectorAll(".h01-q .h01-word"));
  let cumulative = 0;
  const wordStarts = words.map((w) => {
    const dur = BASE_DURATION + w.textContent.trim().length * SEC_PER_CHAR;
    const start = cumulative;
    cumulative += dur;
    return start;
  });

  words.forEach((w, i) => {
    tl.fromTo(
      w,
      { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      wordStarts[i],
    );
  });

  /* Ambient ground dressing settles in alongside the question — not the
     hero, so it may appear early without counting as front-loading. */
  const deco = root.querySelector(".h01-deco-rect");
  const star = root.querySelector(".h01-star");
  tl.fromTo(deco, { opacity: 0, scale: 0, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.5, ease: "power2.out" }, 0.15);
  tl.fromTo(star, { opacity: 0, scale: 0, rotation: 10 }, { opacity: 1, scale: 1, rotation: 10, duration: 0.5, ease: "power2.out" }, 0.3);

  /* ---------------------------------------------------------------
     Scene 2 (2.4–4.075s): "Not anymore" arrives via inverse zoom-through
     (cut-catalog.md) — Phase 3 only (Entry / retraction): the payoff
     has no prior on-screen state to recede, so it lands straight from
     the oversized/blurred/dim "just behind the camera" state and
     retracts into its resting position beneath the settled question.
  --------------------------------------------------------------- */
  const card = root.querySelector(".h01-a-card");
  const SCENE2_START = 2.4;
  const ENTRY_DUR = 0.5;

  tl.fromTo(
    card,
    { scale: 1.25, opacity: 0.15, filter: "blur(10px)" },
    { scale: 1.0, opacity: 1.0, filter: "blur(0px)", duration: ENTRY_DUR, ease: "expo.out" },
    SCENE2_START,
  );

  /* Holds to the cut with at most subtle jitter (sine-wave-loop, low
     amplitude) — idle begins at phase=0 right after the entry settles
     so there is no jump off the arrival's resting state. */
  const TOTAL_DURATION = 4.075;
  const IDLE_START = SCENE2_START + ENTRY_DUR + 0.1; // 3.0s
  const IDLE_DUR = TOTAL_DURATION - IDLE_START; // ~1.075s
  const CYCLES = 0.5;
  const SCALE_AMP = 0.008;
  const Y_AMP_PX = 2;

  const phase = { p: 0 };
  tl.to(
    phase,
    {
      p: Math.PI * 2 * CYCLES,
      duration: IDLE_DUR,
      ease: "none",
      onUpdate: () => {
        const s = Math.sin(phase.p);
        card.style.transform = `scale(${1 + s * SCALE_AMP}) translateY(${s * Y_AMP_PX}px)`;
      },
    },
    IDLE_START,
  );
</script>
